name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

env:
  REGISTRY: ${{ gitea.server_url }}
  IMAGE_REPOSITORY: ${{ gitea.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
          - service: processor
            dockerfile: apps/processor/Dockerfile
            context: apps/processor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build and publish images
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail

          registry="${REGISTRY#https://}"
          registry="${registry#http://}"
          repository="${IMAGE_REPOSITORY,,}"
          image_prefix="${registry}/${repository}"
          package_version="$(node -p "require('./package.json').version")"
          image_tag="${package_version}.build-${GITHUB_RUN_NUMBER}"
          tags=("${image_tag}")

          echo "Application versions:"
          echo "  root: ${package_version}"
          echo "  api: $(node -p "require('./apps/api/package.json').version")"
          echo "  web: $(node -p "require('./apps/web/package.json').version")"
          echo "  processor: N/A (no package.json)"
          echo "Building ${SERVICE} with image tag: ${image_tag}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("${GITHUB_REF_NAME}")
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tags+=("latest")
          fi

          image="${image_prefix}-${SERVICE}"

          docker build -f "${DOCKERFILE}" -t "${image}:${image_tag}" "${BUILD_CONTEXT}"

          for tag in "${tags[@]:1}"; do
            docker tag "${image}:${image_tag}" "${image}:${tag}"
          done

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            for tag in "${tags[@]}"; do
              docker push "${image}:${tag}"
            done
          fi
