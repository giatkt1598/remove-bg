name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

env:
  REGISTRY: ${{ gitea.server_url }}
  IMAGE_REPOSITORY: ${{ gitea.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
          - service: processor
            dockerfile: apps/processor/Dockerfile
            context: apps/processor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build and publish images
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail

          registry="${REGISTRY#https://}"
          registry="${registry#http://}"
          repository="${IMAGE_REPOSITORY,,}"
          image_prefix="${registry}/${repository}"
          package_version="$(node -p "require('./package.json').version")"
          image_tag="${package_version}.build-${GITHUB_RUN_NUMBER}"

          image="${image_prefix}-${SERVICE}"

          docker build -f "${DOCKERFILE}" -t "${image}:${image_tag}" "${BUILD_CONTEXT}"

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            docker push "${image}:${image_tag}"
          fi

  complete:
    needs: docker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        if: needs.docker.result == 'success' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Promote version images
        if: needs.docker.result == 'success' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          registry="${REGISTRY#https://}"
          registry="${registry#http://}"
          repository="${IMAGE_REPOSITORY,,}"
          image_prefix="${registry}/${repository}"
          package_version="$(node -p "require('./package.json').version")"
          image_tag="${package_version}.build-${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            promote_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            promote_tag="latest"
          else
            exit 0
          fi

          for service in api web processor; do
            image="${image_prefix}-${service}"
            docker pull "${image}:${image_tag}"
            docker tag "${image}:${image_tag}" "${image}:${promote_tag}"
            docker push "${image}:${promote_tag}"
          done

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          registry="${REGISTRY#https://}"
          registry="${registry#http://}"
          repository="${IMAGE_REPOSITORY,,}"
          package_version="$(node -p "require('./package.json').version")"
          image_tag="${package_version}.build-${GITHUB_RUN_NUMBER}"

          {
            echo "### Build Complete"
            echo ""
            echo "Build status: ${{ needs.docker.result }}"
            echo ""
            if [[ "${{ needs.docker.result }}" == "success" ]]; then
              echo "Built images:"
              echo ""
              echo " ✅${repository}-api:**${image_tag}**"
              echo ""
              echo " ✅${repository}-web:**${image_tag}**"
              echo ""
              echo " ✅${repository}-processor:**${image_tag}**"
            else
              echo "Build failed or was cancelled. Image publishing may be incomplete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
